<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMarket - Admin Moderation Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
          --primary-blue: #1d4ed8;
          --primary-hover: #1e40af;
          --emerald-600: #059669;
          --emerald-700: #047857;
          --danger-red: #ef4444;
          --danger-hover: #dc2626;
          --slate-900: #0f172a;
          --slate-700: #334155;
          --slate-500: #64748b;
          --slate-400: #94a3b8;
          --slate-200: #e2e8f0;
          --slate-100: #f1f5f9;
          --slate-50:  #f8fafc;
          --white: #ffffff;
          --page-bg: #f4f7fb;
          --card-radius: 16px;
        }

        body {
          background-color: var(--page-bg);
          color: var(--slate-900);
          min-height: 100vh;
          display: flex;
          flex-direction: column;
        }

        /* Admin Navbar */
        .admin-nav {
          background: var(--white);
          border-bottom: 1px solid var(--slate-200);
          padding: 0.95rem 2.5rem;
          display: flex;
          justify-content: space-between;
          align-items: center;
          position: sticky;
          top: 0;
          z-index: 50;
        }

        .brand-logo {
          font-size: 1.35rem;
          font-weight: 800;
          color: var(--slate-900);
          text-decoration: none;
          letter-spacing: -0.02em;
        }
        .brand-logo span { color: var(--primary-blue); }

        .admin-tag {
          background: #faf5ff;
          color: #9333ea;
          font-size: 0.72rem;
          font-weight: 700;
          padding: 4px 10px;
          border-radius: 9999px;
          margin-left: 8px;
          border: 1px solid #e9d5ff;
        }

        .btn-outline-sm {
          border: 1.5px solid var(--slate-200);
          padding: 7px 14px;
          border-radius: 8px;
          background: var(--white);
          color: var(--slate-700);
          text-decoration: none;
          font-size: 0.85rem;
          font-weight: 600;
          cursor: pointer;
        }
        .btn-outline-sm:hover { border-color: var(--slate-400); color: var(--slate-900); }

        /* Admin Content */
        .admin-container {
          max-width: 1200px;
          margin: 2rem auto;
          padding: 0 1.5rem;
          width: 100%;
          flex: 1;
        }

        /* Stats Overview */
        .admin-metrics {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 1.25rem;
          margin-bottom: 2rem;
        }
        .metric-card {
          background: var(--white);
          border: 1px solid var(--slate-200);
          border-radius: var(--card-radius);
          padding: 1.5rem;
          box-shadow: 0 4px 15px -4px rgba(15, 23, 42, 0.05);
        }
        .metric-val {
          font-size: 2rem;
          font-weight: 800;
          color: var(--slate-900);
        }
        .metric-lbl {
          font-size: 0.78rem;
          font-weight: 700;
          color: var(--slate-500);
          text-transform: uppercase;
          letter-spacing: 0.05em;
          margin-top: 4px;
        }

        /* Tab Filters */
        .filter-tabs {
          display: flex;
          gap: 8px;
          margin-bottom: 1.5rem;
        }
        .tab-item {
          background: var(--white);
          border: 1.5px solid var(--slate-200);
          padding: 8px 18px;
          border-radius: 10px;
          font-size: 0.85rem;
          font-weight: 700;
          color: var(--slate-600);
          cursor: pointer;
          transition: all 0.15s;
        }
        .tab-item.active {
          background: var(--primary-blue);
          color: var(--white);
          border-color: var(--primary-blue);
        }

        /* Moderation Row Items */
        .submission-card {
          background: var(--white);
          border: 1.5px solid var(--slate-200);
          border-radius: var(--card-radius);
          padding: 1.5rem;
          margin-bottom: 1.15rem;
          display: grid;
          grid-template-columns: 80px 1fr auto;
          gap: 1.5rem;
          align-items: center;
          transition: border-color 0.15s;
        }
        .submission-card:hover { border-color: var(--slate-300); }

        .sub-image {
          width: 80px;
          height: 80px;
          border-radius: 10px;
          background: var(--slate-100);
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .sub-image img { width: 100%; height: 100%; object-fit: cover; }

        .sub-details h3 {
          font-size: 1.15rem;
          font-weight: 800;
          color: var(--slate-900);
        }
        .sub-price {
          font-size: 1.05rem;
          font-weight: 800;
          color: var(--emerald-600);
          margin-bottom: 0.35rem;
        }
        .sub-meta {
          font-size: 0.8rem;
          color: var(--slate-500);
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          margin-top: 4px;
        }
        .sub-meta span { display: inline-flex; align-items: center; gap: 4px; }

        .action-controls {
          display: flex;
          gap: 8px;
        }

        .btn-approve {
          background: var(--emerald-600);
          color: var(--white);
          border: none;
          padding: 9px 18px;
          border-radius: 8px;
          font-size: 0.88rem;
          font-weight: 700;
          cursor: pointer;
          display: flex;
          align-items: center;
          gap: 6px;
          transition: background 0.15s;
        }
        .btn-approve:hover { background: var(--emerald-700); }

        .btn-reject {
          background: #fef2f2;
          color: var(--danger-red);
          border: 1.5px solid #fecaca;
          padding: 9px 16px;
          border-radius: 8px;
          font-size: 0.88rem;
          font-weight: 700;
          cursor: pointer;
          display: flex;
          align-items: center;
          gap: 6px;
          transition: all 0.15s;
        }
        .btn-reject:hover { background: #fee2e2; }

        .badge-status {
          font-size: 0.72rem;
          font-weight: 800;
          padding: 4px 10px;
          border-radius: 6px;
        }
        .status-PENDING { background: #fef3c7; color: #92400e; }
        .status-APPROVED { background: #d1fae5; color: #065f46; }
        .status-REJECTED { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<!-- Top Header -->
<header class="admin-nav">
    <div style="display: flex; align-items: center;">
        <a href="index.html" class="brand-logo">Campus<span>Market</span></a>
        <span class="admin-tag"><i class="fa-solid fa-shield-halved"></i> Moderator</span>
    </div>

    <div style="display: flex; align-items: center; gap: 1rem;">
        <a href="marketplace.html" class="btn-outline-sm"><i class="fa-solid fa-eye"></i> View Live Feed</a>
        <button onclick="handleLogout()" class="btn-outline-sm"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
    </div>
</header>

<main class="admin-container">
    <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--slate-900);">Product Moderation Queue</h1>
        <p style="color: var(--slate-500); font-size: 0.9rem;">Review student submissions before authorizing them on the campus feed.</p>
    </div>

    <!-- Live Counters -->
    <div class="admin-metrics">
        <div class="metric-card">
            <div class="metric-val" id="metricPending" style="color: #b45309;">0</div>
            <div class="metric-lbl">Awaiting Review</div>
        </div>
        <div class="metric-card">
            <div class="metric-val" id="metricApproved" style="color: var(--emerald-600);">0</div>
            <div class="metric-lbl">Approved Live</div>
        </div>
        <div class="metric-card">
            <div class="metric-val" id="metricTotal" style="color: var(--slate-700);">0</div>
            <div class="metric-lbl">Total Catalog Items</div>
        </div>
    </div>

    <!-- Tab Strip -->
    <div class="filter-tabs">
        <button class="tab-item active" onclick="switchFilter('PENDING', this)">Pending Submissions</button>
        <button class="tab-item" onclick="switchFilter('ALL', this)">All History</button>
    </div>

    <!-- Submissions Container -->
    <div id="submissionsList">
        <div style="text-align: center; color: var(--slate-400); padding: 4rem 1rem;">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 0.75rem;"></i>
            <p>Loading moderation queue...</p>
        </div>
    </div>
</main>

<script>
    const token = localStorage.getItem("token");
    let queueItems = [];
    let activeFilter = "PENDING";

    async function fetchQueue() {
      const container = document.getElementById("submissionsList");
      try {
        const res = await fetch("http://localhost:8080/api/listings/pending", {
          headers: token ? { "Authorization": `Bearer ${token}` } : {}
        });

        if (!res.ok) throw new Error("Could not load pending items");
        queueItems = await res.json();
        updateCounters();
        renderQueue();
      } catch (err) {
        // Local preview seed items
        queueItems = [
          {
            id: 201,
            title: "Calculus 8th Edition - Early Transcendentals",
            price: 450.00,
            location: "District Six - Library Foyer",
            contactInfo: "0821234567",
            status: "PENDING",
            seller: { fullName: "Sipho Ndlovu", email: "sipho@mycput.ac.za" },
            imageUrls: []
          },
          {
            id: 202,
            title: "Casio FX-991ZA Scientific Calculator",
            price: 280.00,
            location: "Bellville - Engineering Building",
            contactInfo: "0719876543",
            status: "PENDING",
            seller: { fullName: "Amina Petersen", email: "amina@mycput.ac.za" },
            imageUrls: []
          }
        ];
        updateCounters();
        renderQueue();
      }
    }

    function updateCounters() {
      const pendingCount = queueItems.filter(i => i.status === "PENDING").length;
      document.getElementById("metricPending").textContent = pendingCount;
      document.getElementById("metricApproved").textContent = queueItems.filter(i => i.status === "APPROVED").length;
      document.getElementById("metricTotal").textContent = queueItems.length;
    }

    function renderQueue() {
      const container = document.getElementById("submissionsList");
      container.innerHTML = "";

      const displayed = (activeFilter === "PENDING")
        ? queueItems.filter(i => i.status === "PENDING")
        : queueItems;

      if (displayed.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; color: var(--slate-400); padding: 4rem 1rem; background: var(--white); border: 1px solid var(--slate-200); border-radius: 16px;">
            <i class="fa-solid fa-clipboard-check" style="font-size: 2.5rem; color: #10b981; margin-bottom: 0.75rem;"></i>
            <p style="font-weight: 700; color: var(--slate-700);">Moderation queue is all caught up!</p>
            <p style="font-size: 0.85rem;">No submissions waiting for admin review right now.</p>
          </div>
        `;
        return;
      }

      displayed.forEach(item => {
        const card = document.createElement("div");
        card.className = "submission-card";
        const img = (item.imageUrls && item.imageUrls.length > 0)
          ? item.imageUrls[0]
          : "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=300&q=80";

        card.innerHTML = `
          <div class="sub-image">
            <img src="${img}" alt="${item.title}">
          </div>

          <div class="sub-details">
            <div class="sub-price">R ${parseFloat(item.price).toFixed(2)}</div>
            <h3>${item.title}</h3>

            <div class="sub-meta">
              <span><i class="fa-solid fa-user"></i> ${item.seller?.fullName || 'Student'} (${item.seller?.email || 'mycput.ac.za'})</span>
              <span><i class="fa-solid fa-location-dot"></i> ${item.location || 'Campus'}</span>
              <span><i class="fa-brands fa-whatsapp"></i> ${item.contactInfo || 'N/A'}</span>
            </div>
          </div>

          <div class="action-controls">
            ${item.status === 'PENDING' ? `
              <button class="btn-approve" onclick="handleModeration(${item.id}, 'approve')">
                <i class="fa-solid fa-check"></i> Approve
              </button>
              <button class="btn-reject" onclick="handleModeration(${item.id}, 'reject')">
                <i class="fa-solid fa-xmark"></i> Reject
              </button>
            ` : `
              <span class="badge-status status-${item.status}">${item.status}</span>
            `}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function switchFilter(type, btn) {
      activeFilter = type;
      document.querySelectorAll(".tab-item").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      renderQueue();
    }

    async function handleModeration(id, action) {
      try {
        const res = await fetch(`http://localhost:8080/api/listings/${id}/${action}`, {
          method: "PUT",
          headers: token ? { "Authorization": `Bearer ${token}` } : {}
        });

        // Update local object status
        const found = queueItems.find(i => i.id === id);
        if (found) {
          found.status = (action === 'approve') ? 'APPROVED' : 'REJECTED';
        }
        updateCounters();
        renderQueue();
      } catch (err) {
        alert("Failed to process status change: " + err.message);
      }
    }

    function handleLogout() {
      localStorage.clear();
      window.location.href = "index.html";
    }

    fetchQueue();
</script>
</body>
</html>
